<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" font-family="'Segoe UI', system-ui, sans-serif">

  <defs>
    <marker id="flechaAbajo" viewBox="0 0 12 12" refX="6" refY="10" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L6 10 L11 1" fill="none" stroke="#006C51" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="flechaArriba" viewBox="0 0 12 12" refX="6" refY="2" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 11 L6 2 L11 11" fill="none" stroke="#006C51" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="flechaIzq" viewBox="0 0 12 12" refX="3" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10 1 L2 6 L10 11" fill="none" stroke="#707974" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="1040" fill="#FBFDF9"/>

  <!-- ================= CABECERA ================= -->
  <g>
    <rect x="48" y="30" width="6" height="46" rx="3" fill="#006C51"/>
    <text x="70" y="52" font-size="25" font-weight="600" fill="#191C1B">PharmaMobil — Arquitectura Clean + MVVM</text>
    <text x="70" y="74" font-size="14" fill="#404944">Kotlin Multiplatform · módulo :shared (commonMain) · inyección con Koin</text>
    <text x="1392" y="48" font-size="13" font-weight="600" fill="#006C51" text-anchor="end">Regla de dependencia</text>
    <text x="1392" y="68" font-size="12.5" fill="#404944" text-anchor="end">La flecha significa «depende de». Todas apuntan al dominio.</text>
  </g>

  <!-- ================= CAPA PRESENTACIÓN ================= -->
  <g>
    <rect x="48" y="112" width="1032" height="218" rx="14" fill="#C2E8FD" stroke="#3F6375" stroke-width="1.5"/>
    <text x="72" y="146" font-size="19" font-weight="700" fill="#001E2B">PRESENTACIÓN</text>
    <text x="230" y="146" font-size="13" fill="#3F6375" font-family="'Cascadia Mono','Consolas',monospace">presentation/ · App.kt · navigation/ · theme/</text>

    <rect x="72" y="170" width="314" height="140" rx="10" fill="#FFFFFF" stroke="#9CC4D8" stroke-width="1.2"/>
    <text x="88" y="194" font-size="13.5" font-weight="700" fill="#001E2B">Pantallas (Compose)</text>
    <text x="88" y="218" font-size="12.5" fill="#404944">ProductoScreen · ClienteScreen</text>
    <text x="88" y="238" font-size="12.5" fill="#404944">InicioScreen · App.kt</text>
    <text x="88" y="258" font-size="12.5" fill="#404944">components/ ValidatedTextField,</text>
    <text x="88" y="276" font-size="12.5" fill="#404944">EstadoVacio, MensajeExito</text>
    <text x="88" y="298" font-size="11.5" fill="#3F6375" font-style="italic">Sin estado de negocio propio</text>

    <rect x="406" y="170" width="314" height="140" rx="10" fill="#FFFFFF" stroke="#9CC4D8" stroke-width="1.2"/>
    <text x="422" y="194" font-size="13.5" font-weight="700" fill="#001E2B">ViewModels</text>
    <text x="422" y="218" font-size="12.5" fill="#404944">ProductoViewModel</text>
    <text x="422" y="238" font-size="12.5" fill="#404944">ClienteViewModel</text>
    <text x="422" y="262" font-size="11.5" fill="#3F6375" font-style="italic">Exponen StateFlow&lt;UiState&gt;.</text>
    <text x="422" y="280" font-size="11.5" fill="#3F6375" font-style="italic">Solo dependen de casos de uso,</text>
    <text x="422" y="298" font-size="11.5" fill="#3F6375" font-style="italic">nunca del repositorio.</text>

    <rect x="740" y="170" width="314" height="140" rx="10" fill="#FFFFFF" stroke="#9CC4D8" stroke-width="1.2"/>
    <text x="756" y="194" font-size="13.5" font-weight="700" fill="#001E2B">Estado y modelos de UI</text>
    <text x="756" y="218" font-size="12.5" fill="#404944">ProductoUiState · ClienteUiState</text>
    <text x="756" y="238" font-size="12.5" fill="#404944">Fase (sealed): Cargando ·</text>
    <text x="756" y="256" font-size="12.5" fill="#404944">SinProductos · ConProductos · Error</text>
    <text x="756" y="276" font-size="12.5" fill="#404944">FormularioProducto · ProductoUi</text>
    <text x="756" y="298" font-size="11.5" fill="#3F6375" font-style="italic">Aquí se formatea (S/ 12.50)</text>
  </g>

  <!-- flecha presentación -> dominio -->
  <line x1="564" y1="336" x2="564" y2="386" stroke="#006C51" stroke-width="2.5" marker-end="url(#flechaAbajo)"/>
  <text x="596" y="354" font-size="13.5" font-weight="600" fill="#006C51">depende del dominio</text>
  <text x="596" y="374" font-size="12.5" fill="#404944">invoca los casos de uso y recibe modelos de dominio</text>

  <!-- ================= CAPA DOMINIO ================= -->
  <g>
    <rect x="48" y="392" width="1032" height="218" rx="14" fill="#89F8CC" stroke="#006C51" stroke-width="2"/>
    <text x="72" y="426" font-size="19" font-weight="700" fill="#002117">DOMINIO</text>
    <text x="182" y="426" font-size="13" fill="#006C51" font-family="'Cascadia Mono','Consolas',monospace">domain/</text>
    <rect x="668" y="408" width="386" height="26" rx="13" fill="#FFFFFF" stroke="#006C51" stroke-width="1.2"/>
    <text x="861" y="426" font-size="12" font-weight="600" fill="#006C51" text-anchor="middle">No depende de ninguna capa · solo kotlin.*</text>

    <rect x="72" y="450" width="314" height="140" rx="10" fill="#FFFFFF" stroke="#6BC3A2" stroke-width="1.2"/>
    <text x="88" y="474" font-size="13.5" font-weight="700" fill="#002117">Modelos</text>
    <text x="88" y="498" font-size="12.5" fill="#404944">Producto · Cliente</text>
    <text x="88" y="518" font-size="12.5" fill="#404944">Pedido · DetallePedido</text>
    <text x="88" y="538" font-size="12.5" fill="#404944">EstadoPedido</text>
    <text x="88" y="562" font-size="11.5" fill="#006C51" font-style="italic">Invariantes en init { require }</text>
    <text x="88" y="580" font-size="11.5" fill="#006C51" font-style="italic">y reglas como requiereReposicion</text>

    <rect x="406" y="450" width="314" height="140" rx="10" fill="#FFFFFF" stroke="#6BC3A2" stroke-width="1.2"/>
    <text x="422" y="474" font-size="13.5" font-weight="700" fill="#002117">Casos de uso</text>
    <text x="422" y="498" font-size="12.5" fill="#404944">RegistrarProductoUseCase</text>
    <text x="422" y="518" font-size="12.5" fill="#404944">ListarProductosUseCase</text>
    <text x="422" y="538" font-size="12.5" fill="#404944">RegistrarClienteUseCase</text>
    <text x="422" y="558" font-size="12.5" fill="#404944">ListarClientesUseCase</text>
    <text x="422" y="580" font-size="11.5" fill="#006C51" font-style="italic">Validan y devuelven Result&lt;T&gt;</text>

    <rect x="740" y="450" width="314" height="140" rx="10" fill="#FFFFFF" stroke="#6BC3A2" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="756" y="474" font-size="13.5" font-weight="700" fill="#002117">Puertos (interfaces)</text>
    <text x="756" y="498" font-size="12.5" fill="#404944">ProductoRepository</text>
    <text x="756" y="518" font-size="12.5" fill="#404944">ClienteRepository</text>
    <text x="756" y="542" font-size="11.5" fill="#006C51" font-style="italic">El dominio declara qué necesita</text>
    <text x="756" y="560" font-size="11.5" fill="#006C51" font-style="italic">(registrar / listar); quién lo guarda</text>
    <text x="756" y="578" font-size="11.5" fill="#006C51" font-style="italic">queda del otro lado.</text>
  </g>

  <!-- flecha datos -> dominio -->
  <line x1="564" y1="666" x2="564" y2="616" stroke="#006C51" stroke-width="2.5" marker-end="url(#flechaArriba)"/>
  <text x="596" y="638" font-size="13.5" font-weight="600" fill="#006C51">implementa los puertos</text>
  <text x="596" y="658" font-size="12.5" fill="#404944">inversión de dependencia: la flecha apunta hacia adentro</text>

  <!-- ================= CAPA DATOS ================= -->
  <g>
    <rect x="48" y="672" width="1032" height="186" rx="14" fill="#CDE9DD" stroke="#4B635B" stroke-width="1.5"/>
    <text x="72" y="706" font-size="19" font-weight="700" fill="#072019">DATOS</text>
    <text x="160" y="706" font-size="13" fill="#4B635B" font-family="'Cascadia Mono','Consolas',monospace">data/repository/</text>

    <rect x="72" y="730" width="314" height="100" rx="10" fill="#FFFFFF" stroke="#9BBBAE" stroke-width="1.2"/>
    <text x="88" y="754" font-size="13.5" font-weight="700" fill="#072019">Implementaciones</text>
    <text x="88" y="778" font-size="12.5" fill="#404944">ProductoRepositorioEnMemoria</text>
    <text x="88" y="798" font-size="12.5" fill="#404944">ClienteRepositorioEnMemoria</text>
    <text x="88" y="818" font-size="11.5" fill="#4B635B" font-style="italic">Asignan el id · Mutex · delay()</text>

    <rect x="406" y="730" width="648" height="100" rx="10" fill="#F5F7F3" stroke="#9BBBAE" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="422" y="754" font-size="13.5" font-weight="700" fill="#4B635B">Preparado para sustituir sin tocar dominio ni presentación</text>
    <text x="422" y="778" font-size="12.5" fill="#707974">ProductoRepositorioRest (Ktor) · ProductoRepositorioLocal (Room / SQLDelight)</text>
    <text x="422" y="800" font-size="12.5" fill="#707974">Basta cambiar una línea en dataModule: single&lt;ProductoRepository&gt; { ... }</text>
    <text x="422" y="820" font-size="11.5" fill="#4B635B" font-style="italic">El motor HTTP entra por platformModule (expect/actual)</text>
  </g>

  <!-- ================= COLUMNA DI ================= -->
  <g>
    <rect x="1112" y="112" width="280" height="746" rx="14" fill="#E9ECE8" stroke="#707974" stroke-width="1.5"/>
    <text x="1132" y="142" font-size="14.5" font-weight="700" fill="#191C1B">INYECCIÓN DE DEPENDENCIAS</text>
    <text x="1132" y="162" font-size="12" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">di/AppModule.kt · initKoin()</text>

    <line x1="1252" y1="316" x2="1252" y2="444" stroke="#BFC9C2" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="1252" y1="596" x2="1252" y2="724" stroke="#BFC9C2" stroke-width="1.5" stroke-dasharray="5 5"/>

    <rect x="1128" y="178" width="248" height="132" rx="10" fill="#FFFFFF" stroke="#BFC9C2" stroke-width="1.2"/>
    <text x="1144" y="202" font-size="13" font-weight="700" fill="#001E2B">presentationModule</text>
    <text x="1144" y="226" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">viewModel {</text>
    <text x="1144" y="244" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">  ProductoViewModel(</text>
    <text x="1144" y="262" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">    get(), get()) }</text>
    <text x="1144" y="282" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">viewModel {</text>
    <text x="1144" y="300" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">  ClienteViewModel(...) }</text>

    <text x="1252" y="384" font-size="11.5" fill="#404944" text-anchor="middle">get() inyecta</text>
    <text x="1252" y="402" font-size="11.5" fill="#404944" text-anchor="middle">los casos de uso</text>

    <rect x="1128" y="450" width="248" height="140" rx="10" fill="#FFFFFF" stroke="#BFC9C2" stroke-width="1.2"/>
    <text x="1144" y="474" font-size="13" font-weight="700" fill="#002117">domainModule</text>
    <text x="1144" y="498" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">factory { Registrar-</text>
    <text x="1144" y="516" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">  ProductoUseCase(get()) }</text>
    <text x="1144" y="534" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">factory { Listar... }</text>
    <text x="1144" y="552" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">factory { ...Cliente... }</text>
    <text x="1144" y="576" font-size="11.5" fill="#006C51" font-style="italic">4 casos de uso</text>

    <text x="1252" y="664" font-size="11.5" fill="#404944" text-anchor="middle">get() inyecta</text>
    <text x="1252" y="682" font-size="11.5" fill="#404944" text-anchor="middle">el repositorio</text>

    <rect x="1128" y="730" width="248" height="100" rx="10" fill="#FFFFFF" stroke="#BFC9C2" stroke-width="1.2"/>
    <text x="1144" y="754" font-size="13" font-weight="700" fill="#072019">dataModule</text>
    <text x="1144" y="778" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">single&lt;ProductoRepository&gt;</text>
    <text x="1144" y="796" font-size="11" fill="#404944" font-family="'Cascadia Mono','Consolas',monospace">  { ...EnMemoria() }</text>
    <text x="1144" y="818" font-size="11.5" fill="#4B635B" font-style="italic">Declarado por la interfaz</text>

    <line x1="1112" y1="244" x2="1084" y2="244" stroke="#707974" stroke-width="1.8" marker-end="url(#flechaIzq)"/>
    <line x1="1112" y1="520" x2="1084" y2="520" stroke="#707974" stroke-width="1.8" marker-end="url(#flechaIzq)"/>
    <line x1="1112" y1="780" x2="1084" y2="780" stroke="#707974" stroke-width="1.8" marker-end="url(#flechaIzq)"/>
  </g>

  <!-- ================= PLATAFORMAS ================= -->
  <g>
    <rect x="48" y="890" width="1344" height="110" rx="14" fill="#EFF1EE" stroke="#BFC9C2" stroke-width="1.5"/>
    <text x="72" y="920" font-size="15" font-weight="700" fill="#191C1B">PLATAFORMAS — puntos de arranque</text>

    <rect x="72" y="932" width="420" height="52" rx="9" fill="#FFFFFF" stroke="#BFC9C2" stroke-width="1.2"/>
    <text x="88" y="952" font-size="12.5" font-weight="600" fill="#191C1B">:androidApp</text>
    <text x="88" y="972" font-size="12" fill="#404944">MainApplication → initKoin { androidContext }  ·  MainActivity → App()</text>

    <rect x="510" y="932" width="420" height="52" rx="9" fill="#FFFFFF" stroke="#BFC9C2" stroke-width="1.2"/>
    <text x="526" y="952" font-size="12.5" font-weight="600" fill="#191C1B">:iosApp</text>
    <text x="526" y="972" font-size="12" fill="#404944">iOSApp.swift → doInitKoinIos()  ·  MainViewController → App()</text>

    <rect x="948" y="932" width="444" height="52" rx="9" fill="#FFFFFF" stroke="#BFC9C2" stroke-width="1.2"/>
    <text x="964" y="952" font-size="12.5" font-weight="600" fill="#191C1B">:shared — androidMain / iosMain</text>
    <text x="964" y="972" font-size="12" fill="#404944">actual val platformModule  ·  hueco para dependencias por plataforma</text>
  </g>

</svg>
